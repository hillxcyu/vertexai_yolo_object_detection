file_type: demo
type: guided_doc
title: Vertex AI Custom YOLO Training and Serving MLOps Blueprint
thumbnail_summary: Train custom YOLO object detection models on Vertex AI Managed Datasets using GCS FUSE and serve AutoML-compatible bounding-box predictions via Custom Prediction Routines.
purpose: |
  Built for **Retail Store Operations VPs, Computer Vision MLOps Leads, and Merchandising Directors**, this blueprint demonstrates how to bridge rapid open-source YOLO experimentation and governed enterprise MLOps on Google Cloud.

  During a live customer pitch, sellers walk buyers through converting YOLO-labeled retail shelf datasets into Vertex AI Managed Datasets, launching serverless GPU training with zero-copy GCS FUSE mounts, and deploying a Custom Prediction Routine that emits AutoML-compatible bounding boxes—enabling instant model upgrades without rewriting downstream shelf-analytics applications.
business_value: |
  * **Eliminate Downstream App Rewrites:** Preserves the exact Vertex AI AutoML Object Detection JSON contract via a Custom Prediction Routine, cutting model-swap integration effort from weeks to zero code changes.
  * **Accelerate Time-to-Production:** Replaces brittle manual training scripts with a reproducible Click-to-Deploy Terraform and Vertex AI pipeline, compressing deployment cycles by over 75%.
  * **Eliminate Idle GPU Infrastructure Spend:** Uses serverless Vertex AI Custom Training with on-demand T4 GPUs and automatic teardown, eliminating 24/7 VM cluster overhead.
technical_value: |
  * **Zero-Copy GCS FUSE Training Pipeline:** Streams Vertex AI Managed Dataset shards and images directly over `/gcs/` FUSE mounts using symlinks, avoiding redundant multi-gigabyte dataset downloads inside training containers.
  * **AutoML-Compatible Custom Prediction Routine:** Implements a Vertex AI `Predictor` in `cpr_src/predictor.py` that loads `best.pt` and `class_map.json` from Cloud Storage and returns normalized `displayNames`, `confidences`, and `bboxes`.
  * **Supply-Chain & IAM Hardened Provisioning:** Packages Artifact Registry repositories, uniform-access GCS buckets, least-privilege training/serving service accounts, and SHA-256 hash-pinned Python dependencies (`--require-hashes`).
